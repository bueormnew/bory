[package]
name = "bory"
version = "0.4.0"
edition = "2024"
authors = ["BUEORM"]
license = "MIT"
description = "BORY programming language interpreter"

[dependencies]
chrono = { version = "0.4", features = ["clock"] }
minifb = "0.27"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
